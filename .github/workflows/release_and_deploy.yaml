name: Release & Deploy

on:
    push:
        tags:
          - 'v[0-9]+.[0-9]+.[0-9]+'

env:
    DOCKER_IMAGE: endergofficial/leavenull_bot

jobs:
    security-check:
        name: Security & Vulnerability Scan
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Run Trivy vulnerability scanner (Filesystem)
            uses: aquasecurity/trivy-action@master
            with:
                scan-type: 'fs'
                ignore-unfixed: true
                format: 'table'
                severity: 'CRITICAL,HIGH'

    build-and-push:
        name: Build, Scan & Push
        needs: security-check
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Extract metadata for Docker
            id: meta
            uses: docker/metadata-action@v5
            with:
                images: ${{ env.DOCKER_IMAGE }}
                tags: |
                    type=semver,pattern={{version}},prefix=v
                    type=semver,pattern={{major}}.{{minor}},prefix=v
                    type=semver,pattern={{major}},prefix=v

          - name: Build Docker image (locally without push)
            uses: docker/build-push-action@v5
            with:
                context: .
                push: false
                load: true
                tags: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

          - name: Scan built Docker image with Trivy (Local)
            uses: aquasecurity/trivy-action@master
            with:
                image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}'
                format: 'table'
                exit-code: '1'
                severity: 'CRITICAL'

          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_TOKEN }}

          - name: Push Docker image to Docker Hub
            uses: docker/build-push-action@v5
            with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}

          - name: Sync README to Docker Hub
            uses: peter-evans/dockerhub-description@v5
            with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_TOKEN }}
                repository: ${{ env.DOCKER_IMAGE }}
                readme-filepath: ./README.md

          - name: Create GitHub Release
            uses: softprops/action-gh-release@v1
